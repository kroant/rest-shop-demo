application:
  scheduling:
    enable: false

spring:
  datasource:
    url: jdbc:h2:mem:test
  jpa:
    open-in-view: false
    show-sql: true
    hibernate.ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  web:
    locale: en

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false